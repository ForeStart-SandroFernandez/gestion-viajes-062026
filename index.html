<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Viajes - Acceso Privado</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f4f9; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: none; } /* Oculto por defecto */
        .login-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <!-- Pantalla de Login Temporal -->
    <div id="login" class="login-box">
        <h3>Sistema de Gestión de Viajes</h3>
        <input type="password" id="pass" placeholder="Introduce la contraseña">
        <button onclick="validar()">Ingresar</button>
    </div>

    <!-- Tu app de Google -->
    <iframe id="app" src="https://script.google.com/macros/s/TU_ID_DE_SCRIPT/exec"></iframe>

    <script>
        function validar() {
            var claveCorrecta = ".Fore.2026."; // <-- CAMBIA ESTO POR LA CONTRASEÑA QUE QUIERAS
            var input = document.getElementById("pass").value;
            
            if (input === claveCorrecta) {
                document.getElementById("login").style.display = "none";
                document.getElementById("app").style.display = "block";
            } else {
                alert("Contraseña incorrecta");
            }
        }
    </script>
</body>
</html>
